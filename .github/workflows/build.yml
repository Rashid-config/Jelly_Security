name: build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build Jellyfin.Plugin.JellySecurity.slnx -c Release --nologo
      - name: Test
        run: dotnet test Jellyfin.Plugin.JellySecurity.slnx -c Release --nologo --verbosity normal
